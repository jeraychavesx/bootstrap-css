<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseño web Jeray Chaves</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Boku&family=Shippori+Mincho:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary sakura-nav" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand brand-mark" href="#">
                <span class="hanko" aria-hidden="true">桜</span>
                <span class="brand-text">
                    <strong>Jeray Chaves</strong>
                    <small>Diseño web</small>
                </span>
            </a>
            <span class="nav-motto">Bootstrap CSS<em aria-hidden="true">道</em></span>
        </div>
    </nav>

    <main class="stage">
        <header class="hero">
            <h1>Jeray Chaves</h1>
            <p>Diseño web · Toca un pétalo para descubrir</p>
            <p class="progress-count" id="count" aria-live="polite">0 de 9 descubiertos</p>
        </header>

        <!-- Los 9 pétalos se generan desde js/main.js -->
        <div id="petals" class="petals" role="list"></div>
        <div id="falling" class="falling" aria-hidden="true"></div>
    </main>

    <!-- Panel de contenido -->
    <div class="modal fade" id="infoModal" tabindex="-1" aria-labelledby="infoTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content scroll-card">
                <div class="modal-body">
                    <span class="seal" id="infoKanji" aria-hidden="true"></span>
                    <h2 id="infoTitle"></h2>
                    <p id="infoText"></p>
                    <button type="button" class="btn-close-sakura" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="./js/main.js"></script>
</body>
</html>
